<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>BLAHAJ KIKKOU FULL-3D</title>
<style>
/* Anime Pseudo-3D Reusable 100% Pixel-Art Studio UI Theme
 * Zero non-zero border-radius, zero backdrop-filter blur, zero native range/select styling.
 */
:root {
  --bg-deep: #0b1126;
  --panel-bg: #141c3a;
  --panel-hi: #2d3e76;
  --panel-lo: #080c1c;
  --border-ink: #050814;
  --accent-cyan: #58c4ff;
  --accent-blue: #4d6bfe;
  --accent-gold: #facc15;
  --text-main: #eef4ff;
  --text-dim: #9ab0db;
}

* {
  box-sizing: border-box;
  border-radius: 0;
  user-select: none;
  -webkit-user-select: none;
}

html, body, #appRoot {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg-deep);
  color: var(--text-main);
  font-family: "Courier New", "Noto Sans Mono CJK JP", monospace;
}

::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}
::-webkit-scrollbar-track {
  background: #090e20;
  border: 2px solid var(--border-ink);
}
::-webkit-scrollbar-thumb {
  background: #3a5296;
  border: 2px solid var(--border-ink);
  box-shadow: inset 2px 2px 0 #6b88d8, inset -2px -2px 0 #1e2d5c;
}

button {
  appearance: none;
  -webkit-appearance: none;
  font-family: inherit;
  cursor: pointer;
  border-radius: 0;
}

:focus-visible {
  outline: 2px solid var(--accent-gold);
  outline-offset: 2px;
}

.app-shell {
  display: grid;
  grid-template-columns: 1fr 376px;
  width: 100%;
  height: 100%;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
}

.stage-wrap {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #dfe9f8;
}

#stageCanvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
  cursor: grab;
}
#stageCanvas.dragging {
  cursor: grabbing;
}

.drop-overlay {
  position: absolute;
  inset: 12px;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: rgba(11, 17, 38, 0.88);
  border: 4px dashed var(--accent-cyan);
  color: #ffffff;
  font-size: 14px;
  font-weight: 900;
  letter-spacing: 1px;
  pointer-events: none;
  z-index: 20;
}
.drop-overlay.active {
  display: flex;
}
.drop-overlay-sub {
  font-size: 11px;
  color: var(--accent-gold);
}

.empty-stage-banner {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  padding: 16px 22px;
  background: rgba(14, 22, 48, 0.96);
  border: 3px solid var(--border-ink);
  box-shadow: inset 2px 2px 0 #3a549c, inset -2px -2px 0 #070b18, 0 5px 0 rgba(0, 0, 0, 0.55);
  text-align: center;
  z-index: 15;
}
.empty-stage-banner h2 {
  margin: 0 0 6px 0;
  font-size: 14px;
  color: var(--accent-cyan);
  letter-spacing: 1px;
}
.empty-stage-banner p {
  margin: 0 0 12px 0;
  font-size: 11px;
  color: var(--text-dim);
}

.stage-badge {
  position: absolute;
  top: 12px;
  left: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 11px;
  background: var(--panel-bg);
  border: 2px solid var(--border-ink);
  box-shadow: inset 2px 2px 0 var(--panel-hi), inset -2px -2px 0 var(--panel-lo), 0 4px 0 rgba(0, 0, 0, 0.55);
  pointer-events: none;
}
.stage-badge-title {
  font-size: 13px;
  font-weight: 900;
  letter-spacing: 1px;
  color: #ffffff;
}
.stage-badge-sub {
  font-size: 10px;
  font-weight: 700;
  color: var(--accent-cyan);
  margin-top: 2px;
}

.hud-chip {
  position: absolute;
  top: 12px;
  right: 12px;
  padding: 6px 10px;
  background: rgba(14, 22, 48, 0.94);
  border: 2px solid var(--border-ink);
  box-shadow: inset 2px 2px 0 #293c74, inset -2px -2px 0 #070b18, 0 3px 0 rgba(0, 0, 0, 0.5);
  font-size: 12px;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
  color: var(--accent-gold);
  pointer-events: none;
  letter-spacing: 0.6px;
}

.status-toast {
  position: absolute;
  left: 50%;
  bottom: 54px;
  transform: translateX(-50%);
  padding: 6px 12px;
  background: rgba(14, 22, 48, 0.96);
  border: 2px solid var(--accent-cyan);
  box-shadow: 0 4px 0 rgba(0, 0, 0, 0.6);
  font-size: 11px;
  font-weight: 900;
  color: #ffffff;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.16s linear;
  z-index: 25;
}
.status-toast.show {
  opacity: 1;
}

.px-ico {
  width: 16px;
  height: 16px;
  image-rendering: pixelated;
  flex-shrink: 0;
  display: inline-block;
  vertical-align: middle;
}
.px-ico-lg {
  width: 24px;
  height: 24px;
}

.stage-footer {
  position: absolute;
  left: 12px;
  right: 12px;
  bottom: 12px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 10px;
  pointer-events: none;
}
.hint-box {
  padding: 5px 9px;
  background: rgba(12, 18, 40, 0.92);
  border: 2px solid var(--border-ink);
  box-shadow: inset 2px 2px 0 #233364, inset -2px -2px 0 #070b18;
  font-size: 10px;
  font-weight: 700;
  color: var(--text-dim);
  pointer-events: none;
}
.touch-rot-group {
  display: flex;
  gap: 7px;
  pointer-events: auto;
}

.panel {
  display: flex;
  flex-direction: column;
  background: var(--panel-bg);
  border-left: 3px solid var(--border-ink);
  box-shadow: inset 2px 0 0 var(--panel-hi);
  overflow-y: auto;
  padding: 7px;
  gap: 5px;
}

.panel-section {
  background: #0f1630;
  border: 2px solid var(--border-ink);
  box-shadow: inset 2px 2px 0 #243364, inset -2px -2px 0 #070b18, 0 3px 0 rgba(0, 0, 0, 0.45);
  padding: 6px 8px;
}

.sec-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 0.9px;
  color: var(--accent-cyan);
  padding-bottom: 3px;
  margin-bottom: 5px;
  border-bottom: 2px solid #22305e;
}
.sec-head-left {
  display: flex;
  align-items: center;
  gap: 6px;
}

.motion-nav-inline {
  display: flex;
  align-items: center;
  gap: 4px;
}
.motion-nav-btn {
  min-height: 20px;
  padding: 1px 6px;
  font-size: 10px;
}
.motion-count-badge {
  font-size: 10px;
  font-variant-numeric: tabular-nums;
  color: var(--accent-gold);
  padding: 0 3px;
}

.motion-cat-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 5px;
}
.cat-pill {
  min-height: 21px;
  padding: 2px 6px;
  font-size: 9px;
  background: #18254c;
  color: var(--text-dim);
  border: 2px solid var(--border-ink);
  box-shadow: inset 1px 1px 0 #314786, inset -1px -1px 0 #0c1228;
  font-weight: 900;
}
.cat-pill.active {
  background: #2563eb;
  color: #ffffff;
  box-shadow: inset 1px 1px 0 #7dd3fc, inset -1px -1px 0 #173a8a;
}

.motion-shelf {
  max-height: 138px;
  overflow-y: auto;
  padding-right: 2px;
}
.motion-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
}
.motion-grid.cols-1 {
  grid-template-columns: 1fr;
}
.motion-grid.cols-2 {
  grid-template-columns: repeat(2, 1fr);
}
.motion-btn {
  flex-direction: column;
  align-items: flex-start;
  padding: 3px 5px;
  min-height: 36px;
  gap: 1px;
  overflow: hidden;
}
.motion-btn-top {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  font-weight: 900;
  white-space: nowrap;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
}
.motion-btn-sub {
  font-size: 9px;
  font-weight: 700;
  color: #a8bee8;
  white-space: nowrap;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
}
.motion-btn.active .motion-btn-sub {
  color: #e0f2fe;
}
.motion-btn.accent-ceo {
  background: #2b2968;
  box-shadow: inset 2px 2px 0 #6862c8, inset -2px -2px 0 #171542, 0 3px 0 rgba(0, 0, 0, 0.55);
}
.motion-btn.accent-companion {
  background: #1d3c78;
  box-shadow: inset 2px 2px 0 #5b90ff, inset -2px -2px 0 #10234d, 0 3px 0 rgba(0, 0, 0, 0.55);
}
.motion-btn.accent-attack {
  background: #144468;
  box-shadow: inset 2px 2px 0 #48b8ea, inset -2px -2px 0 #0a253d, 0 3px 0 rgba(0, 0, 0, 0.55);
}
.motion-btn.active {
  background: #2563eb;
  color: #ffffff;
  box-shadow: inset 2px 2px 0 #7dd3fc, inset -2px -2px 0 #173a8a, 0 3px 0 rgba(0, 0, 0, 0.55);
}

.timeline-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 10px;
  font-weight: 900;
  color: var(--text-dim);
  margin-top: 7px;
  margin-bottom: 4px;
}
.timeline-head .val {
  color: var(--accent-gold);
  font-variant-numeric: tabular-nums;
}
.timeline-bar {
  display: grid;
  grid-template-columns: repeat(24, 1fr);
  gap: 2px;
  height: 16px;
  padding: 2px;
  background: #070b18;
  border: 2px solid var(--border-ink);
  cursor: pointer;
  touch-action: none;
}
.tl-cell {
  background: #1b2852;
  height: 100%;
}
.tl-cell.past {
  background: #2f57b8;
}
.tl-cell.cur {
  background: var(--accent-gold);
}

.mode-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 5px;
}
.mode-grid .px-btn {
  min-height: 25px;
  padding: 3px 6px;
  font-size: 10px;
}

.preset-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5px;
}
.preset-grid .px-btn {
  min-height: 26px;
  padding: 3px 6px;
  font-size: 10px;
}

.file-io-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 5px;
}
.file-io-row.export-only {
  grid-template-columns: 1fr;
}
.file-io-row .px-btn {
  min-height: 26px;
  padding: 3px 4px;
  font-size: 10px;
}
.hidden-file-input {
  display: none;
}

.slider-row {
  display: grid;
  grid-template-columns: 72px 1fr 46px 56px;
  align-items: center;
  gap: 7px;
  padding: 4px 0;
  border-bottom: 2px solid #1e2a54;
  font-size: 10px;
  font-weight: 900;
}
.slider-row:last-child {
  border-bottom: none;
  padding-bottom: 1px;
}
.slider-label {
  color: var(--text-main);
  white-space: nowrap;
}
.slider-val {
  text-align: right;
  font-variant-numeric: tabular-nums;
  color: var(--accent-gold);
}
.slider-action {
  width: 56px;
  min-height: 25px;
  padding: 3px 0;
  font-size: 10px;
}

.px-slider {
  position: relative;
  width: 100%;
  height: 22px;
  display: flex;
  align-items: center;
  cursor: pointer;
  touch-action: none;
}
.px-slider-track {
  position: relative;
  width: 100%;
  height: 11px;
  background: #080c1d;
  border: 2px solid var(--border-ink);
  box-shadow: inset 2px 2px 0 #040610, inset -1px -1px 0 #2b3c72;
  overflow: hidden;
}
.px-slider-fill {
  height: 100%;
  background: var(--accent-blue);
  box-shadow: inset 0 2px 0 #93d5ff, inset -2px -2px 0 #1e429f;
  width: 50%;
}
.px-slider-ticks {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(90deg, transparent 0 8px, rgba(5, 8, 20, 0.72) 8px 10px);
}
.px-slider-thumb {
  position: absolute;
  top: 1px;
  width: 11px;
  height: 20px;
  transform: translateX(-5px);
  background: #e2ecff;
  border: 2px solid var(--border-ink);
  box-shadow: inset 2px 2px 0 #ffffff, inset -2px -2px 0 #6c82b0, 0 2px 0 rgba(0, 0, 0, 0.65);
  pointer-events: none;
  left: 50%;
}
.px-slider:hover .px-slider-thumb,
.px-slider.dragging .px-slider-thumb {
  background: var(--accent-gold);
}

.px-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  min-height: 28px;
  padding: 4px 7px;
  background: #233368;
  color: #f4f8ff;
  border: 2px solid var(--border-ink);
  box-shadow: inset 2px 2px 0 #4662b4, inset -2px -2px 0 #121c3e, 0 3px 0 rgba(0, 0, 0, 0.55);
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 0.3px;
}
.px-btn:hover {
  background: #2d4386;
}
.px-btn:active {
  transform: translateY(2px);
  box-shadow: inset 2px 2px 0 #121c3e, inset -2px -2px 0 #4662b4;
}
.px-btn.active {
  background: #2563eb;
  color: #ffffff;
  box-shadow: inset 2px 2px 0 #7dd3fc, inset -2px -2px 0 #173a8a, 0 3px 0 rgba(0, 0, 0, 0.55);
}
.px-btn.pink {
  background: #be185d;
  color: #fff1f2;
  box-shadow: inset 2px 2px 0 #f9a8d4, inset -2px -2px 0 #70103a, 0 3px 0 rgba(0, 0, 0, 0.55);
}
.px-btn.gold {
  background: #b47b14;
  color: #fffbeb;
  box-shadow: inset 2px 2px 0 #fde047, inset -2px -2px 0 #714908, 0 3px 0 rgba(0, 0, 0, 0.55);
}
.px-btn.teal {
  background: #0f5f76;
  color: #e6fbff;
  box-shadow: inset 2px 2px 0 #5eead4, inset -2px -2px 0 #083344, 0 3px 0 rgba(0, 0, 0, 0.55);
}

.toggle-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}

@media (max-width: 860px) {
  .app-shell {
    grid-template-columns: 1fr;
    grid-template-rows: 52% 48%;
  }
  .panel {
    border-left: none;
    border-top: 3px solid var(--border-ink);
    box-shadow: inset 0 2px 0 var(--panel-hi);
    padding: 8px;
    gap: 7px;
  }
  .stage-badge {
    top: 8px;
    left: 8px;
    padding: 5px 8px;
  }
  .stage-badge-title {
    font-size: 11px;
  }
  .stage-badge-sub {
    font-size: 9px;
  }
  .hud-chip {
    top: auto;
    right: auto;
    left: 8px;
    bottom: 8px;
    padding: 5px 8px;
    font-size: 11px;
  }
  .hint-box {
    display: none;
  }
  .stage-footer {
    bottom: 8px;
    right: 8px;
    justify-content: flex-end;
  }
  .motion-shelf {
    max-height: 150px;
  }
  .slider-row {
    grid-template-columns: 68px 1fr 44px 54px;
    gap: 6px;
    padding: 5px 0;
  }
  .slider-action {
    width: 54px;
  }
}

</style>
</head>

 *   - Live `.ap3d` Load / Append-Merge / Export + Drag-and-Drop onto the 3D stage.
 */
(function (global) {
  "use strict";

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = text;
    return node;
  }

  function createPixelSlider({ id, label, min, max, step, getVal, setVal, formatVal, actionText, actionId, onAction, ariaLabel }) {
    const row = el("div", "slider-row");
    const lbl = el("span", "slider-label", label);

    const slider = el("div", "px-slider");
    if (id) slider.id = id;
    slider.setAttribute("role", "slider");
    slider.setAttribute("tabindex", "0");
    slider.setAttribute("aria-label", ariaLabel || label);
    slider.setAttribute("aria-valuemin", String(min));
    slider.setAttribute("aria-valuemax", String(max));

    const track = el("div", "px-slider-track");
    const fill = el("div", "px-slider-fill");
    const ticks = el("div", "px-slider-ticks");
    track.appendChild(fill);
    track.appendChild(ticks);
    const thumb = el("div", "px-slider-thumb");
    slider.appendChild(track);
    slider.appendChild(thumb);

    const valSpan = el("span", "slider-val");
    if (id) valSpan.id = id.replace(/^sl/, "val");

    const actBtn = el("button", "px-btn slider-action", actionText || "");
    actBtn.type = "button";
    if (actionId) actBtn.id = actionId;
    if (onAction) actBtn.addEventListener("click", onAction);

    row.appendChild(lbl);
    row.appendChild(slider);
    row.appendChild(valSpan);
    row.appendChild(actBtn);

    function sync() {
      let v;
      try { v = getVal(); } catch (_) { return; }
      if (typeof v !== "number" || Number.isNaN(v)) return;
      const pct = Math.max(0, Math.min(1, (v - min) / Math.max(1e-6, max - min))) * 100;
      fill.style.width = pct.toFixed(2) + "%";
      thumb.style.left = pct.toFixed(2) + "%";
      slider.setAttribute("aria-valuenow", String(v));
      valSpan.textContent = formatVal ? formatVal(v) : String(v);
    }

    function setFromClientX(clientX) {
      const rect = slider.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / Math.max(1, rect.width)));
      let v = min + ratio * (max - min);
      v = Math.round(v / step) * step;
      v = Math.max(min, Math.min(max, v));
      setVal(v);
      sync();
    }

    slider.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      slider.setPointerCapture(e.pointerId);
      slider.classList.add("dragging");
      setFromClientX(e.clientX);
    });
    slider.addEventListener("pointermove", (e) => {
      if (!slider.classList.contains("dragging")) return;
      setFromClientX(e.clientX);
    });
    const endDrag = () => slider.classList.remove("dragging");
    slider.addEventListener("pointerup", endDrag);
    slider.addEventListener("pointercancel", endDrag);
    slider.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" || e.key === "ArrowDown") {
        e.preventDefault();
        setVal(Math.max(min, getVal() - step));
        sync();
      } else if (e.key === "ArrowRight" || e.key === "ArrowUp") {
        e.preventDefault();
        setVal(Math.min(max, getVal() + step));
        sync();
      }
    });

    sync();
    return { el: row, slider, valSpan, actionBtn: actBtn, sync };
  }

  function createTimelineScrubber({ onScrub }) {
    const wrap = el("div", "timeline-wrap");
    const head = el("div", "timeline-head");
    const headLbl = el("span", "", "TIMELINE (SCRUB)");
    const tlVal = el("span", "val", "F01 / 24");
    tlVal.id = "tlVal";
    head.appendChild(headLbl);
    head.appendChild(tlVal);

    const bar = el("div", "timeline-bar");
    bar.id = "timelineBar";
    bar.setAttribute("role", "slider");
    bar.setAttribute("tabindex", "0");
    bar.setAttribute("aria-label", "Animation Timeline");
    bar.setAttribute("aria-valuemin", "1");

    wrap.appendChild(head);
    wrap.appendChild(bar);

    let cells = [];
    let frameCount = 24;

    function rebuild(count) {
      frameCount = Math.max(1, count | 0);
      bar.innerHTML = "";
      bar.style.gridTemplateColumns = `repeat(${frameCount}, 1fr)`;
      bar.setAttribute("aria-valuemax", String(frameCount));
      cells = [];
      for (let i = 0; i < frameCount; i++) {
        const c = el("div", "tl-cell" + (i === 0 ? " cur" : ""));
        bar.appendChild(c);
        cells.push(c);
      }
    }
    rebuild(24);

    function update(fIdx, count) {
      const fc = Math.max(1, (count || frameCount) | 0);
      if (cells.length !== fc) rebuild(fc);
      const safeF = Math.max(0, Math.min(fc - 1, fIdx | 0));
      for (let i = 0; i < fc; i++) {
        cells[i].className = i === safeF ? "tl-cell cur" : (i < safeF ? "tl-cell past" : "tl-cell");
      }
      tlVal.textContent = `F${String(safeF + 1).padStart(2, "0")} / ${fc}`;
      bar.setAttribute("aria-valuenow", String(safeF + 1));
    }

    let dragging = false;
    function scrubAt(clientX) {
      const rect = bar.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(0.9999, (clientX - rect.left) / Math.max(1, rect.width)));
      const f = Math.floor(ratio * frameCount);
      if (onScrub) onScrub(f);
    }
    bar.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      dragging = true;
      bar.setPointerCapture(e.pointerId);
      scrubAt(e.clientX);
    });
    bar.addEventListener("pointermove", (e) => { if (dragging) scrubAt(e.clientX); });
    bar.addEventListener("pointerup", () => { dragging = false; });
    bar.addEventListener("pointercancel", () => { dragging = false; });

    return { el: wrap, bar, valSpan: tlVal, update };
  }

  function createMotionShelf({ onSelect, onStep, getAssetSrc }) {
    const section = el("div", "panel-section");
    const head = el("div", "sec-head");
    const headLeft = el("div", "sec-head-left");
    const headIco = el("img", "px-ico");
    headIco.setAttribute("data-ico", "ico_anim");
    headIco.alt = "motions";
    const headTitle = el("span", "", "MOTIONS");
    headTitle.id = "motionHead";
    headLeft.appendChild(headIco);
    headLeft.appendChild(headTitle);

    const nav = el("div", "motion-nav-inline");
    const btnPrev = el("button", "px-btn motion-nav-btn", "<");
    btnPrev.type = "button";
    btnPrev.id = "btnMotionPrev";
    btnPrev.title = "Previous Motion ([)";
    const countBadge = el("span", "motion-count-badge", "1/1");
    countBadge.id = "motionCounter";
    const btnNext = el("button", "px-btn motion-nav-btn", ">");
    btnNext.type = "button";
    btnNext.id = "btnMotionNext";
    btnNext.title = "Next Motion (])";
    btnPrev.addEventListener("click", () => { if (onStep) onStep(-1); });
    btnNext.addEventListener("click", () => { if (onStep) onStep(1); });
    nav.appendChild(btnPrev);
    nav.appendChild(countBadge);
    nav.appendChild(btnNext);

    head.appendChild(headLeft);
    head.appendChild(nav);
    section.appendChild(head);

    const catBar = el("div", "motion-cat-bar");
    catBar.id = "motionCatBar";
    section.appendChild(catBar);

    const shelf = el("div", "motion-shelf");
    const grid = el("div", "motion-grid");
    grid.id = "motionGrid";
    shelf.appendChild(grid);
    section.appendChild(shelf);

    let allMotions = [];
    let activeMotionId = "";
    let activeCategory = "ALL";

    function renderGrid() {
      const visible = activeCategory === "ALL"
        ? allMotions
        : allMotions.filter((m) => (m.category || "GENERAL").toUpperCase() === activeCategory);

      grid.innerHTML = "";
      grid.className = "motion-grid";
      if (visible.length <= 1) grid.classList.add("cols-1");
      else if (visible.length <= 4) grid.classList.add("cols-2");

      visible.forEach((m) => {
        const globalIdx = allMotions.indexOf(m);
        const btn = el("button", "px-btn motion-btn");
        btn.type = "button";
        if (m.accent && m.accent !== "default") btn.classList.add("accent-" + m.accent);
        if (m.id === activeMotionId) btn.classList.add("active");
        btn.setAttribute("data-motion", m.id);

        const top = el("span", "motion-btn-top");
        if (m.icon) {
          const ico = el("img", "px-ico");
          ico.setAttribute("data-ico", m.icon);
          ico.alt = "";
          if (getAssetSrc) {
            const src = getAssetSrc(m.icon);
            if (src) ico.src = src;
          }
          top.appendChild(ico);
        }
        top.appendChild(el("span", "", `${globalIdx + 1}.${m.label}`));
        btn.appendChild(top);
        if (m.subtitle) {
          btn.appendChild(el("span", "motion-btn-sub", m.subtitle));
        }
        btn.addEventListener("click", () => { if (onSelect) onSelect(m.id); });
        grid.appendChild(btn);
      });
    }

    function refresh(motions, activeId) {
      allMotions = Array.isArray(motions) ? motions : [];
      activeMotionId = activeId || (allMotions[0] ? allMotions[0].id : "");

      const curIdx = Math.max(0, allMotions.findIndex((m) => m.id === activeMotionId));
      const curM = allMotions[curIdx];
      const fc = curM ? (curM.frames || 24) : 1;
      if (allMotions.length === 0) {
        headTitle.textContent = "NO MODEL LOADED";
      } else if (allMotions.length === 1 && fc === 1) {
        headTitle.textContent = "STATIC 3D MODEL";
      } else {
        headTitle.textContent = `${allMotions.length} MOTIONS (${fc}F)`;
      }
      nav.style.display = allMotions.length > 1 ? "flex" : "none";
      countBadge.textContent = allMotions.length > 0 ? `${curIdx + 1}/${allMotions.length}` : "0/0";

      // Build optional category filter pills whenever 2+ distinct categories exist
      const cats = [];
      const catSet = new Set();
      for (const m of allMotions) {
        if (m.category) {
          const c = String(m.category).toUpperCase();
          if (!catSet.has(c)) { catSet.add(c); cats.push(c); }
        }
      }
      if (cats.length >= 2) {
        if (activeCategory !== "ALL" && !catSet.has(activeCategory)) activeCategory = "ALL";
        catBar.style.display = "flex";
        catBar.innerHTML = "";
        ["ALL", ...cats].forEach((c) => {
          const pill = el("button", "cat-pill" + (c === activeCategory ? " active" : ""), c);
          pill.type = "button";
          pill.setAttribute("data-cat", c);
          pill.addEventListener("click", () => {
            activeCategory = c;
            catBar.querySelectorAll(".cat-pill").forEach((p) => p.classList.toggle("active", p.getAttribute("data-cat") === c));
            renderGrid();
          });
          catBar.appendChild(pill);
        });
      } else {
        activeCategory = "ALL";
        catBar.style.display = "none";
        catBar.innerHTML = "";
      }

      renderGrid();
    }

    function setActive(activeId) {
      const changed = (activeId !== activeMotionId);
      activeMotionId = activeId;
      const curIdx = Math.max(0, allMotions.findIndex((m) => m.id === activeMotionId));
      countBadge.textContent = allMotions.length > 0 ? `${curIdx + 1}/${allMotions.length}` : "0/0";
      grid.querySelectorAll("[data-motion]").forEach((btn) => {
        const isAct = btn.getAttribute("data-motion") === activeMotionId;
        btn.classList.toggle("active", isAct);
        if (changed && isAct) {
          // Scroll ONLY the inner .motion-shelf container so mobile .panel scroll never jumps!
          const top = btn.offsetTop - shelf.offsetTop;
          const bot = top + btn.offsetHeight;
          if (top < shelf.scrollTop) shelf.scrollTop = top;
          else if (bot > shelf.scrollTop + shelf.clientHeight) shelf.scrollTop = bot - shelf.clientHeight;
        }
      });
    }

    return { el: section, refresh, setActive };
  }

  function createFileIOControls({ onLoadFile, onMergeFile, onExport }) {
    const section = el("div", "panel-section");
    const head = el("div", "sec-head");
    const headLeft = el("div", "sec-head-left");
    const ico = el("img", "px-ico");
    ico.setAttribute("data-ico", "ico_layers");
    ico.alt = "package";
    const headTitle = el("span", "", "PACKAGE & EXPORT");
    headLeft.appendChild(ico);
    headLeft.appendChild(headTitle);
    head.appendChild(headLeft);
    section.appendChild(head);

    const fmtBar = el("div", "motion-cat-bar");
    fmtBar.id = "exportFmtBar";
    fmtBar.style.display = "none";
    section.appendChild(fmtBar);

    const row = el("div", "file-io-row");

    const inputLoad = el("input", "hidden-file-input");
    inputLoad.type = "file";
    inputLoad.id = "ap3dLoadInput";
    inputLoad.accept = ".ap3d,.json,application/octet-stream";
    inputLoad.addEventListener("change", () => {
      if (inputLoad.files && inputLoad.files[0] && onLoadFile) {
        onLoadFile(inputLoad.files[0]);
      }
      inputLoad.value = "";
    });

    const inputMerge = el("input", "hidden-file-input");
    inputMerge.type = "file";
    inputMerge.id = "ap3dMergeInput";
    inputMerge.accept = ".ap3d,.json,application/octet-stream";
    inputMerge.addEventListener("change", () => {
      if (inputMerge.files && inputMerge.files[0] && onMergeFile) {
        onMergeFile(inputMerge.files[0]);
      }
      inputMerge.value = "";
    });

    const btnLoad = el("button", "px-btn teal", "LOAD");
    btnLoad.type = "button";
    btnLoad.id = "btnLoadAp3d";
    btnLoad.title = "Load .ap3d character package";
    btnLoad.addEventListener("click", () => inputLoad.click());

    const btnMerge = el("button", "px-btn", "+MOTION");
    btnMerge.type = "button";
    btnMerge.id = "btnMergeAp3d";
    btnMerge.title = "Append motions from another .ap3d file";
    btnMerge.addEventListener("click", () => inputMerge.click());

    const btnExport = el("button", "px-btn gold", "EXPORT");
    btnExport.type = "button";
    btnExport.id = "btnExportAp3d";
    btnExport.title = "Export in selected format";
    let selectedFormat = "ap3d";
    let currentFormats = [];
    let currentCanLoad = true;
    btnExport.addEventListener("click", () => { if (onExport) onExport(selectedFormat); });

    row.appendChild(btnLoad);
    row.appendChild(btnMerge);
    row.appendChild(btnExport);
    section.appendChild(row);
    section.appendChild(inputLoad);
    section.appendChild(inputMerge);

    function updateExportLabel() {
      const active = currentFormats.find((f) => f.id === selectedFormat);
      btnExport.textContent = (!currentCanLoad && active) ? ("EXPORT " + active.label) : "EXPORT";
    }

    function syncCapabilities(formats, canLoad) {
      currentFormats = Array.isArray(formats) ? formats : [];
      currentCanLoad = Boolean(canLoad);
      if (currentFormats.length === 0 && !currentCanLoad) {
        section.style.display = "none";
        return;
      }
      section.style.display = "";
      headTitle.textContent = currentCanLoad ? "PACKAGE & EXPORT" : "EXPORT 3D / IMAGE";
      btnLoad.style.display = currentCanLoad ? "" : "none";
      btnMerge.style.display = currentCanLoad ? "" : "none";
      row.classList.toggle("export-only", !currentCanLoad);

      if (currentFormats.length > 0 && !currentFormats.some((f) => f.id === selectedFormat)) {
        selectedFormat = currentFormats[0].id;
      }
      fmtBar.innerHTML = "";
      if (currentFormats.length >= 2) {
        fmtBar.style.display = "flex";
        currentFormats.forEach((f) => {
          const pill = el("button", "cat-pill" + (f.id === selectedFormat ? " active" : ""), f.label);
          pill.type = "button";
          pill.setAttribute("data-expfmt", f.id);
          pill.addEventListener("click", () => {
            selectedFormat = f.id;
            fmtBar.querySelectorAll(".cat-pill").forEach((p) => p.classList.toggle("active", p.getAttribute("data-expfmt") === selectedFormat));
            updateExportLabel();
          });
          fmtBar.appendChild(pill);
        });
      } else {
        fmtBar.style.display = "none";
      }
      updateExportLabel();
    }

    return {
      el: section,
      btnLoad,
      btnMerge,
      btnExport,
      syncCapabilities,
      getSelectedFormat: () => selectedFormat,
      triggerLoad: () => inputLoad.click(),
    };
  }

    const DEFAULTS = Object.assign({ motion: "witness", animFps: 24, renderMode: 2, dotSize: 1.35, pitchDeg: 20, spacing: 1.0, zoom: 1.45, themeIdx: 1, angleDeg: 338.0 }, CFG.defaults || {});

    let mainMesh = null, witnessMesh = null;
    const staticTex = {};
    for (const [k, src] of Object.entries(ASSET_MAP)) {
      const img = new Image();
      img.onload = () => {
        const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
        const f = (CFG.assetLinear && CFG.assetLinear[k]) ? gl.LINEAR : gl.NEAREST;
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, f); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, f);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        staticTex[k] = tex;
      };
      img.src = src;
    }

    if (opts.meshPayload) {
      decompressMeshData(opts.meshPayload).then((bytes) => {
        mainMesh = createGpuMesh(bytes, opts.meshPayload.main);
        if (opts.meshPayload.witness) witnessMesh = createGpuMesh(bytes, opts.meshPayload.witness);
        if (opts.onSceneChange) opts.onSceneChange();
      }).catch((err) => console.error("Mesh unpack error:", err));
    }

    const state = {
      motion: DEFAULTS.motion, motionSwitchTime: performance.now() * 0.001,
      animPlaying: true, animFps: DEFAULTS.animFps, animPhase: 0, manualFrame: 0, lastFrameIdx: 0,
      renderMode: DEFAULTS.renderMode, dotSize: DEFAULTS.dotSize,
      springOn: true, fxOn: true, sqX: 1, sqY: 1, sqVx: 0, sqVy: 0,
      angle: (DEFAULTS.angleDeg * Math.PI) / 180, autoSpin: true, spinSpeed: 0.42,
      pitchDeg: DEFAULTS.pitchDeg, spacing: DEFAULTS.spacing, zoom: DEFAULTS.zoom,
      faceFocus: false, outlineOn: true, stageOn: true, themeIdx: DEFAULTS.themeIdx,
      dragActive: false, dragLastX: 0, dragLastY: 0, dragId: null, holdRotDir: 0,
    };
    const keys = { left: false, right: false };
    const callbacks = { onHudUpdate: opts.onHudUpdate, onTimelineUpdate: opts.onTimelineUpdate, onStateChange: opts.onStateChange };
    function notifyState() { if (callbacks.onStateChange) callbacks.onStateChange(); }
    function curMotionDef() { return MOTION_BY_ID[state.motion] || MOTION_LIST[0] || null; }
    function impulseSquash(sx, sy) { if (!state.springOn) return; state.sqX = sx; state.sqY = sy; state.sqVx = 0; state.sqVy = 0; }
    function stepSpring(dt) {
      if (!state.springOn) { state.sqX = 1; state.sqY = 1; state.sqVx = 0; state.sqVy = 0; return; }
      state.sqVx += ((1 - state.sqX) * 160 - state.sqVx * 16) * dt;
      state.sqVy += ((1 - state.sqY) * 160 - state.sqVy * 16) * dt;
      state.sqX = Math.max(0.76, Math.min(1.26, state.sqX + state.sqVx * dt));
      state.sqY = Math.max(0.76, Math.min(1.26, state.sqY + state.sqVy * dt));
    }

    function drawQuadSprite(tex, cx, cy, w, h, alpha, rotRad, tint) {
      if (!tex || alpha <= 0.01) return;
      gl.useProgram(spriteProg);
      gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
      gl.enableVertexAttribArray(spLoc.aPos); gl.vertexAttribPointer(spLoc.aPos, 2, gl.FLOAT, false, 0, 0);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.uniform1i(spLoc.uTex, 0); gl.uniform4f(spLoc.uRect, cx, cy, w, h); gl.uniform2f(spLoc.uRes, canvas.width, canvas.height);
      gl.uniform1f(spLoc.uRot, rotRad || 0); gl.uniform1f(spLoc.uAlpha, alpha);
      const t = tint || [1, 1, 1]; gl.uniform3f(spLoc.uTint, t[0], t[1], t[2]);
      gl.drawArrays(gl.TRIANGLES, 0, 6); gl.disableVertexAttribArray(spLoc.aPos);
    }

    function drawMeshPass1(gpuMesh, isWitness) {
      gl.bindBuffer(gl.ARRAY_BUFFER, gpuMesh.vbo);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gpuMesh.ibo);
      const stride = 14 * 4;
      gl.enableVertexAttribArray(mLoc.aPos); gl.vertexAttribPointer(mLoc.aPos, 3, gl.FLOAT, false, stride, 0);
      gl.enableVertexAttribArray(mLoc.aNorm); gl.vertexAttribPointer(mLoc.aNorm, 3, gl.FLOAT, false, stride, 12);
      gl.enableVertexAttribArray(mLoc.aCol); gl.vertexAttribPointer(mLoc.aCol, 4, gl.FLOAT, false, stride, 24);
      gl.enableVertexAttribArray(mLoc.aRig); gl.vertexAttribPointer(mLoc.aRig, 4, gl.FLOAT, false, stride, 40);
      gl.uniform1f(mLoc.uIsWitness, isWitness ? 1.0 : 0.0);
      gl.drawElements(gl.TRIANGLES, gpuMesh.iCount, gl.UNSIGNED_SHORT, 0);
    }

    function hash1(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453123; return x - Math.floor(x); }

    function renderFrame(nowSec) {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const cw = Math.max(1, Math.floor(rect.width * dpr)), ch = Math.max(1, Math.floor(rect.height * dpr));
      if (canvas.width !== cw || canvas.height !== ch) { canvas.width = cw; canvas.height = ch; }
      const theme = THEMES[state.themeIdx];
      const mDef = curMotionDef();

      // 1. Draw Studio Grid Backdrop directly on screen
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, cw, ch);
      gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND);
      gl.useProgram(bgProg);
      gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
      gl.enableVertexAttribArray(bgLoc.aPos); gl.vertexAttribPointer(bgLoc.aPos, 2, gl.FLOAT, false, 0, 0);
      gl.uniform2f(bgLoc.uRes, cw, ch); gl.uniform3fv(bgLoc.uBg, theme.bg); gl.uniform3fv(bgLoc.uGrid, theme.grid);
      gl.uniform3fv(bgLoc.uStar, theme.star); gl.uniform3fv(bgLoc.uStarHi, theme.starHi); gl.uniform1f(bgLoc.uTime, nowSec);
      gl.drawArrays(gl.TRIANGLES, 0, 6); gl.disableVertexAttribArray(bgLoc.aPos);

      if (!mainMesh || !mDef) return;

      const fc = mDef.frames || 24;
      const phaseF = state.animPlaying ? state.animPhase : state.manualFrame;
      const fIdx = Math.floor(phaseF) % fc;
      const pose = evalSharkPose(mDef.id, phaseF);

      const pitchRad = (state.pitchDeg * Math.PI) / 180;
      const sinP = Math.sin(pitchRad), cosP = Math.cos(pitchRad);
      const ca = Math.cos(state.angle), sa = Math.sin(state.angle);
      const targetZ = state.faceFocus ? 58.0 : 54.0;
      const targetX = state.faceFocus ? -22.0 : 0.0;
      const aspect = cw / Math.max(1, ch);
      const halfH = (state.faceFocus ? 46.0 : 94.0) / Math.max(0.5, state.zoom / 1.45);
      const halfW = halfH * aspect;
      const unitPx = (ch * 0.5) / halfH;

      const camDist = 320.0;
      const eyeX = targetX + sa * cosP * camDist;
      const eyeY = -ca * cosP * camDist;
      const eyeZ = targetZ + sinP * camDist;
      // Continuous exact spherical tangent up-vector (zero gimbal flip anywhere from -85° to +90°!)
      const upVec = [-sa * sinP, ca * sinP, cosP];
      const viewM = mat4LookAt([eyeX, eyeY, eyeZ], [targetX, 0.0, targetZ], upVec);
      const projM = mat4Ortho(-halfW, halfW, -halfH, halfH, 10.0, 700.0);
      const mvp = mat4Mul(projM, viewM);

      const vdX = sa * cosP, vdY = -ca * cosP, vdZ = sinP;
      const cR = [viewM[0], viewM[4], viewM[8]], cU = [viewM[1], viewM[5], viewM[9]];
      const lightDir = [-0.26 * cR[0] + 0.58 * vdX + 0.76 * cU[0], -0.26 * cR[1] + 0.58 * vdY + 0.76 * cU[1], -0.26 * cR[2] + 0.58 * vdZ + 0.76 * cU[2]];

      function project3D(wx, wy, wz) {
        const cx = mvp[0]*wx + mvp[4]*wy + mvp[8]*wz + mvp[12];
        const cy = mvp[1]*wx + mvp[5]*wy + mvp[9]*wz + mvp[13];
        const cz = mvp[2]*wx + mvp[6]*wy + mvp[10]*wz + mvp[14];
        return { sx: (cx * 0.5 + 0.5) * cw, sy: (0.5 - cy * 0.5) * ch, ndcZ: cz };
      }

      // Compute 3D Witness Pet state (matches original sprite-stack orbit: swims forward along tangent looking around!)
      let witOrb = null;
      if (state.fxOn && mDef.companion && witnessMesh) {
        const orb = mDef.companion;
        const orbPh = (phaseF / fc) * TWO_PI;
        const rx = orb.rx ?? 64, ry = orb.ry ?? 54;
        const wx = rx * Math.cos(orbPh);
        const wy = ry * Math.sin(orbPh);
        const wz = (orb.zBase ?? 46) + (orb.zSin1 ?? -10) * Math.sin(orbPh) + (orb.zSin2 ?? 5) * Math.sin(2 * orbPh);
        const vx = -rx * Math.sin(orbPh), vy = ry * Math.cos(orbPh);
        const yaw = (orb.faceTangent !== false) ? Math.atan2(-vx, vy) : 0.0;
        witOrb = { wx, wy, wz, yaw, pitch: 0.0 };
      }

      // Helper: True 3D World-Space Turntable Pedestal + 3D Cylindrical Rim + 3D Shadows (auto-pixelated in PIXEL+AA & RETRO PX!)
      function drawStage3D(isUnderside) {
        if (!state.stageOn) return;
        const alphaMul = isUnderside ? 0.34 : 1.0;
        const ringRad = 66.0;
        const pixelize = (state.renderMode <= 1);
        if (pixelize) {
          ensureStageFbo(cw, ch);
          gl.bindFramebuffer(gl.FRAMEBUFFER, stageFbo);
          gl.viewport(0, 0, cw, ch);
          gl.clearColor(0, 0, 0, 0); gl.clearDepth(1.0);
          gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        } else {
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          gl.viewport(0, 0, cw, ch);
          gl.clearDepth(1.0);
          gl.clear(gl.DEPTH_BUFFER_BIT);
        }
        gl.useProgram(stage3dProg);
        gl.uniformMatrix4fv(stLoc.uMVP, false, mvp);
        gl.uniform3fv(stLoc.uLightDir, lightDir);
        gl.uniform3fv(stLoc.uOutCol, theme.outline);
        gl.uniform1f(stLoc.uPosterize, state.renderMode === 1 ? 1.0 : 0.0);
        gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

        // 1. 3D Extruded Cylindrical Pedestal Rim (Z = 0 down to -4.2) with hardware DEPTH_TEST!
        gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.depthMask(true);
        gl.bindBuffer(gl.ARRAY_BUFFER, rim3dBuf);
        gl.enableVertexAttribArray(stLoc.aPos); gl.vertexAttribPointer(stLoc.aPos, 3, gl.FLOAT, false, 32, 0);
        gl.enableVertexAttribArray(stLoc.aNorm); gl.vertexAttribPointer(stLoc.aNorm, 3, gl.FLOAT, false, 32, 12);
        gl.enableVertexAttribArray(stLoc.aUv); gl.vertexAttribPointer(stLoc.aUv, 2, gl.FLOAT, false, 32, 24);
        gl.uniform3f(stLoc.uCenter, 0.0, 0.0, 0.0);
        gl.uniform3f(stLoc.uScale, ringRad, ringRad, 4.2);
        gl.uniform1i(stLoc.uKind, 2);
        gl.uniform1f(stLoc.uAlpha, 0.92 * alphaMul);
        gl.uniform3f(stLoc.uTint, 0.36, 0.64, 0.94);
        gl.drawArrays(gl.TRIANGLES, 0, RIM_SEGS * 6);

        // 2. 3D Rotating Turntable Top Disc + Compass Degree Ticks (Z = 0.0)
        gl.depthMask(false);
        gl.bindBuffer(gl.ARRAY_BUFFER, plane3dBuf);
        gl.vertexAttribPointer(stLoc.aPos, 3, gl.FLOAT, false, 32, 0);
        gl.vertexAttribPointer(stLoc.aNorm, 3, gl.FLOAT, false, 32, 12);
        gl.vertexAttribPointer(stLoc.aUv, 2, gl.FLOAT, false, 32, 24);
        gl.activeTexture(gl.TEXTURE0);
        if (staticTex.turntableRing) {
          gl.bindTexture(gl.TEXTURE_2D, staticTex.turntableRing);
          gl.uniform1i(stLoc.uTex, 0);
          gl.uniform3f(stLoc.uCenter, 0.0, 0.0, isUnderside ? -0.15 : 0.05);
          gl.uniform3f(stLoc.uScale, ringRad, ringRad, 1.0);
          gl.uniform1i(stLoc.uKind, 1);
          gl.uniform1f(stLoc.uAlpha, 0.95 * alphaMul);
          gl.uniform3f(stLoc.uTint, 1.0, 1.0, 1.0);
          gl.drawArrays(gl.TRIANGLES, 0, 6);
        }

        // 3. 3D Floor Wave Rings & 3D Pendulum-Tracking Shadows (fade cleanly when looking from underneath!)
        if (!isUnderside) {
          gl.disable(gl.DEPTH_TEST);
          if (state.fxOn && mDef.fx && staticTex.fxWaveRing) {
            gl.bindTexture(gl.TEXTURE_2D, staticTex.fxWaveRing);
            gl.uniform1i(stLoc.uKind, 0);
            gl.uniform3f(stLoc.uTint, 0.85, 0.98, 1.0);
            for (const fx of mDef.fx) {
              if (fx.type !== "floor_wave_rings") continue;
              const rings = fx.count || 1, startF = fx.startFrame ?? 6, durF = fx.durationFrames ?? 12, stagger = fx.staggerFrames ?? 4;
              for (let r = 0; r < rings; r++) {
                const rp = (phaseF - startF + r * stagger) / durF;
                if (rp > 0 && rp < 1) {
                  const sc = (fx.startScale ?? 0.5) + rp * (fx.expandScale ?? 1.1);
                  gl.uniform3f(stLoc.uCenter, 0.0, 0.0, 0.25);
                  gl.uniform3f(stLoc.uScale, 64.0 * sc, 64.0 * sc, 1.0);
                  gl.uniform1f(stLoc.uAlpha, Math.sin(rp * Math.PI) * 0.86);
                  gl.drawArrays(gl.TRIANGLES, 0, 6);
                }
              }
            }
          }
          if (staticTex.shadowDither) {
            gl.bindTexture(gl.TEXTURE_2D, staticTex.shadowDither);
            gl.uniform1i(stLoc.uKind, 0);
            gl.uniform3f(stLoc.uTint, 1.0, 1.0, 1.0);
            // Main hanging shark 3D ground shadow sways dynamically with pendulum swing!
            const shX = -pose.swingRoll * 0.72, shY = pose.swingPitch * 0.55;
            gl.uniform3f(stLoc.uCenter, shX, shY, 0.35);
            gl.uniform3f(stLoc.uScale, 37.0 * state.sqX, 34.0 * state.sqX, 1.0);
            gl.uniform1f(stLoc.uAlpha, 0.90);
            gl.drawArrays(gl.TRIANGLES, 0, 6);
            // Witness Pet 3D ground shadow directly beneath (wx, wy, 0) on the spinning 3D stage!
            if (witOrb) {
              const ws = Math.max(0.65, 1.05 - (witOrb.wz - 32.0) * 0.008);
              gl.uniform3f(stLoc.uCenter, witOrb.wx, witOrb.wy, 0.38);
              gl.uniform3f(stLoc.uScale, 17.5 * ws * state.sqX, 17.5 * ws * state.sqX, 1.0);
              gl.uniform1f(stLoc.uAlpha, 0.48);
              gl.drawArrays(gl.TRIANGLES, 0, 6);
            }
          }
        }
        gl.disable(gl.DEPTH_TEST); gl.depthMask(true);
        gl.disableVertexAttribArray(stLoc.aPos);
        gl.disableVertexAttribArray(stLoc.aNorm);
        gl.disableVertexAttribArray(stLoc.aUv);
        if (pixelize) {
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          gl.viewport(0, 0, cw, ch);
          gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
          gl.useProgram(blitProg);
          gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
          gl.enableVertexAttribArray(blLoc.aPos); gl.vertexAttribPointer(blLoc.aPos, 2, gl.FLOAT, false, 0, 0);
          gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, stageTex);
          gl.uniform1i(blLoc.uTex, 0);
          gl.uniform2f(blLoc.uRes, cw, ch);
          gl.uniform1f(blLoc.uPixelStep, Math.max(1.0, state.dotSize * dpr * 1.9));
          gl.uniform1f(blLoc.uPosterize, state.renderMode === 1 ? 1.0 : 0.0);
          gl.drawArrays(gl.TRIANGLES, 0, 6);
          gl.disableVertexAttribArray(blLoc.aPos);
        }
      }

      // Collect 3D FX particles & depth-sort them into BACK (behind shark) vs FRONT (in front of shark)!
      const fxBack = [], fxFront = [];
      const spZ = Math.max(0.35, state.spacing);
      const mapZ = (z) => (z - 22.0) * spZ + 22.0;
      const centerNdcZ = project3D(0.0, 0.0, mapZ(50.0)).ndcZ;
      if (state.fxOn && mDef.fx) {
        const t = (phaseF % fc) / fc, ph = t * TWO_PI;
        for (const fx of mDef.fx) {
          if (fx.type === "orbit_trail") {
            const count = fx.count || 14;
            for (let i = 0; i < count; i++) {
              const pLag = ph - (i / count) * 0.42 * TWO_PI;
              const wx = (fx.rx ?? 64) * Math.cos(pLag) + (hash1(i * 3.1) - 0.5) * 14;
              const wy = (fx.ry ?? 54) * Math.sin(pLag) + (hash1(i * 5.7) - 0.5) * 14;
              const life = i / count;
              const wz = mapZ((fx.zBase ?? 50) + (fx.zSin1 ?? -10) * Math.sin(pLag) + (fx.zSin2 ?? 5) * Math.sin(2 * pLag) + life * 22);
              const p3 = project3D(wx, wy, wz);
              const isA = (i % 3 === 0);
              const tex = staticTex[isA ? (fx.primarySprite || "fxDroplet") : (fx.secondarySprite || "fxBubble")];
              const sz = (isA ? (10.5 * (1 - life * 0.45)) : (7.5 + 3.5 * hash1(i * 9.3))) * unitPx;
              const item = { tex, sx: p3.sx, sy: p3.sy, sz, a: Math.sin((1 - life) * Math.PI) * 0.95, z: p3.ndcZ };
              (p3.ndcZ > centerNdcZ ? fxBack : fxFront).push(item);
            }
          } else if (fx.type === "sparkle_perimeter") {
            const glowW = Math.max(0, Math.sin(Math.max(0, Math.min(1, (phaseF - (fx.startFrame ?? 0)) / (fx.durationFrames ?? 24))) * Math.PI));
            const coords = fx.points || [];
            for (let i = 0; i < coords.length; i++) {
              const [bx, by, bz] = coords[i];
              const beat = (t * 2.0 + i * 0.19) % 1.0, pop = Math.sin(beat * Math.PI);
              const p3 = project3D(bx, by, mapZ(bz + beat * 9.0));
              const sz = (7.2 + 6.0 * pop) * (0.45 + 0.55 * glowW) * unitPx;
              const item = { tex: staticTex[beat < 0.55 ? (fx.sprite0 || "fxSpark_0") : (fx.sprite1 || "fxSpark_1")], sx: p3.sx, sy: p3.sy, sz, a: pop * (0.35 + 0.65 * glowW), z: p3.ndcZ };
              (p3.ndcZ > centerNdcZ ? fxBack : fxFront).push(item);
            }
          } else if (fx.type === "burst_above") {
            const w = Math.max(0, Math.sin(Math.max(0, Math.min(1, (phaseF - (fx.startFrame ?? 12)) / (fx.durationFrames ?? 11))) * Math.PI));
            if (w > 0.05) {
              const count = fx.count || 5, tex = staticTex[fx.sprite || "fxSpark_0"];
              for (let k = 0; k < count; k++) {
                const prog = (t * 2.4 + k * 0.21) % 1.0;
                const p3 = project3D((k - (count - 1) * 0.5) * 12.5, (fx.y ?? 14) + Math.sin(k * 2.1) * 8, mapZ((fx.zBase ?? 86) + prog * 36));
                const sz = 11.5 * Math.sin(prog * Math.PI) * unitPx;
                const item = { tex, sx: p3.sx, sy: p3.sy, sz, a: Math.sin(prog * Math.PI) * w, z: p3.ndcZ };
                (p3.ndcZ > centerNdcZ ? fxBack : fxFront).push(item);
              }
            }
          }
        }
        fxBack.sort((a, b) => b.z - a.z);
        fxFront.sort((a, b) => b.z - a.z);
      }

      // 2. Draw 3D Stage (when above floor: behind shark) + Back-half 3D FX particles
      const underFloor = (eyeZ < 0.0);
      if (!underFloor) drawStage3D(false);
      gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      for (const it of fxBack) drawQuadSprite(it.tex, it.sx, it.sy, it.sz, it.sz, it.a, 0);

      // 3. PASS 1 — Render Clean 3D Meshes into 2x-SSAA Transparent FBO (Hardware Depth Buffer, ZERO Inverted-Hull!)
      const ss = ensureSceneFbo(cw, ch);
      gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFbo);
      gl.viewport(0, 0, fboW, fboH);
      gl.clearColor(0, 0, 0, 0);
      gl.clearDepth(1.0);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL);
      gl.disable(gl.BLEND); gl.disable(gl.CULL_FACE);

      gl.useProgram(meshProg);
      gl.uniformMatrix4fv(mLoc.uMVP, false, mvp);
      const sxB = pose.stretchX, szB = pose.squashZ, syB = 1.0 / Math.sqrt(Math.max(0.4, sxB * szB));
      gl.uniform3f(mLoc.uPegPos, 4.0, 0.0, 95.5);
      gl.uniform1f(mLoc.uZLift, mDef.id === "bonk" ? 12.0 : 11.0);
      gl.uniform3f(mLoc.uSwingRad, pose.swingRoll * Math.PI / 180, pose.swingPitch * Math.PI / 180, pose.twistYaw * Math.PI / 180);
      gl.uniform3f(mLoc.uBodyScale, sxB, syB, szB);
      gl.uniform2f(mLoc.uSpring, state.sqX, state.sqY);
      gl.uniform4f(mLoc.uAnimA, pose.bobZ, pose.wiggleAmp, pose.wigglePhase, pose.ropeTwist);
      gl.uniform4f(mLoc.uAnimB, pose.finFlapL, pose.finFlapR, pose.finSweep, pose.jawOpen);
      gl.uniform4f(mLoc.uAnimC, pose.tailWagY, pose.tailCurlZ, pose.headNod * Math.PI / 180, state.spacing);
      gl.uniform1i(mLoc.uExpr, pose.expr);
      gl.uniform1f(mLoc.uDizzyPhase, pose.dizzyPhase);
      gl.uniform1i(mLoc.uRenderMode, state.renderMode);
      gl.uniform3f(mLoc.uViewDir, vdX, vdY, vdZ);
      gl.uniform3fv(mLoc.uLightDir, lightDir);

      drawMeshPass1(mainMesh, false);
      if (witOrb) {
        const wph = (phaseF / fc) * TWO_PI;
        gl.uniform4f(mLoc.uWitPosAng, witOrb.wx, witOrb.wy, witOrb.wz, witOrb.yaw);
        gl.uniform4f(mLoc.uWitAnim, 2.4 * Math.sin(wph * 2), 0.6 * Math.sin(wph * 4), 3.0 * Math.sin(wph * 2 - 0.7), 2.6 * Math.sin(wph * 2 - 0.9));
        gl.uniform1f(mLoc.uWitPitch, witOrb.pitch);
        drawMeshPass1(witnessMesh, true);
      }

      // 4. PASS 2 — True 2x2-SSAA Exact-ID Resolve + Glass-Smooth 16-Direction Silhouette Outline Composite!
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, cw, ch);
      gl.disable(gl.DEPTH_TEST);
      gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      gl.useProgram(compProg);
      gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
      gl.enableVertexAttribArray(cpLoc.aPos); gl.vertexAttribPointer(cpLoc.aPos, 2, gl.FLOAT, false, 0, 0);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sceneTex);
      gl.uniform1i(cpLoc.uSceneTex, 0);
      gl.uniform2f(cpLoc.uTexel, 1.0 / cw, 1.0 / ch);
      gl.uniform2f(cpLoc.uSubOff, fboSS >= 2 ? 0.5 / fboW : 0.0, fboSS >= 2 ? 0.5 / fboH : 0.0);
      gl.uniform2f(cpLoc.uRes, cw, ch);
      gl.uniform1f(cpLoc.uOutOn, state.outlineOn ? 1.0 : 0.0);
      const outPx = (state.renderMode === 3 ? 2.2 : 2.8) * dpr;
      gl.uniform1f(cpLoc.uOutPx, outPx);
      gl.uniform3fv(cpLoc.uOutCol, theme.outline);
      gl.uniform1i(cpLoc.uMode, state.renderMode);
      gl.uniform1f(cpLoc.uPixelStep, Math.max(1.0, state.dotSize * dpr * 1.9));
      gl.drawArrays(gl.TRIANGLES, 0, 6);
      gl.disableVertexAttribArray(cpLoc.aPos);

      // 5. If camera is BELOW Z=0 floor, draw translucent 3D frosted-glass pedestal underside cleanly in front!
      if (underFloor) drawStage3D(true);

      // 6. Front-half 3D Depth-Sorted FX Particles & 3D Witness-Tracking "傻眼……" Speech Bubble!
      gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      for (const it of fxFront) drawQuadSprite(it.tex, it.sx, it.sy, it.sz, it.sz, it.a, 0);

      if (state.fxOn && mDef.billboard && staticTex[mDef.billboard.assetKey]) {
        const bb = mDef.billboard;
        const age = Math.max(0, nowSec - state.motionSwitchTime);
        const pop = age < 0.25 ? (1 + 0.14 * Math.sin((age / 0.25) * Math.PI)) * (age / 0.25) : 1;
        // Anchor directly above the 3D Witness Pet's head when active so it follows in 3D & NEVER covers the pet!
        const petCenter = witOrb ? project3D(witOrb.wx, witOrb.wy, mapZ(witOrb.wz)) : null;
        const anchor = witOrb
          ? project3D(witOrb.wx, witOrb.wy, mapZ(witOrb.wz + 22.0))
          : project3D(0, 0, mapZ(bb.anchorZ ?? 116));
        const bScale = Math.max(0.95 * dpr, Math.min(2.10 * dpr, unitPx * 0.54)) * Math.max(0.1, pop);
        const bw = (bb.width || 128) * bScale, bh = (bb.height || 56) * bScale;
        const ox = witOrb ? 34.0 * bScale : (bb.offsetX ?? 68) * bScale;
        const oy = witOrb ? -36.0 * bScale : (bb.offsetY ?? -38) * bScale;
        let bx = Math.max(bw * 0.52 + 10 * dpr, Math.min(cw - bw * 0.52 - 10 * dpr, anchor.sx + ox));
        let by = Math.max(bh * 0.52 + 54 * dpr, Math.min(ch - bh * 0.52 - 12 * dpr, anchor.sy + oy + Math.sin((phaseF / fc) * TWO_PI) * (bb.bobAmp ?? 2.8) * unitPx));
        if (petCenter && Math.abs(bx - petCenter.sx) < bw * 0.45 && Math.abs(by - petCenter.sy) < bh * 0.72) {
          const altX = petCenter.sx + (petCenter.sx > cw * 0.55 ? -(bw * 0.62 + 16 * dpr) : (bw * 0.62 + 16 * dpr));
          bx = Math.max(bw * 0.52 + 10 * dpr, Math.min(cw - bw * 0.52 - 10 * dpr, altX));
        }
        drawQuadSprite(staticTex[bb.assetKey], bx, by, bw, bh, 0.98, 0);
      }

      const deg = Math.round((((state.angle % TWO_PI) + TWO_PI) % TWO_PI) * (180 / Math.PI)) % 360;
      const fStr = String(fIdx + 1).padStart(2, "0");
      if (callbacks.onHudUpdate) {
        callbacks.onHudUpdate((window.innerWidth <= 860)
          ? `${mDef.label} F${fStr} ${String(deg).padStart(3, "0")}D`
          : `${mDef.label} F${fStr}/${fc} | FULL 3D | ${String(deg).padStart(3, "0")} DEG`);
      }
    }

    function selectMotion(id) {
      const m = MOTION_BY_ID[id]; if (!m) return;
      state.motion = id; state.motionSwitchTime = performance.now() * 0.001;
      state.animPhase = 0; state.manualFrame = 0; state.lastFrameIdx = 0; state.animPlaying = true;
      const imp = m.impulse || [1.04, 0.96]; impulseSquash(imp[0], imp[1]);
      if (callbacks.onTimelineUpdate) callbacks.onTimelineUpdate(0, m.frames || 24);
      notifyState();
    }
    function stepMotion(d) {
      if (MOTION_LIST.length <= 1) return;
      const idx = Math.max(0, MOTION_LIST.findIndex((m) => m.id === state.motion));
      selectMotion(MOTION_LIST[(idx + d + MOTION_LIST.length) % MOTION_LIST.length].id);
    }
    function setFrame(f) {
      const fc = curMotionDef() ? (curMotionDef().frames || 24) : 24;
      state.animPlaying = false; state.manualFrame = Math.max(0, Math.min(fc - 1, f | 0)); state.animPhase = state.manualFrame;
      if (callbacks.onTimelineUpdate) callbacks.onTimelineUpdate(state.manualFrame, fc);
      notifyState();
    }
    function togglePlay() {
      const fc = curMotionDef() ? (curMotionDef().frames || 24) : 24;
      if (state.animPlaying) { state.manualFrame = Math.floor(state.animPhase) % fc; state.animPlaying = false; }
      else { state.animPhase = state.manualFrame; state.animPlaying = true; }
      if (callbacks.onTimelineUpdate) callbacks.onTimelineUpdate(state.manualFrame, fc);
      notifyState();
    }
    function toggleFaceFocus() {
      state.faceFocus = !state.faceFocus;
      state.zoom = state.faceFocus ? 2.15 : DEFAULTS.zoom;
      if (state.faceFocus) state.pitchDeg = DEFAULTS.pitchDeg;
      notifyState();
    }
    function resetAll() {
      state.motion = DEFAULTS.motion; state.animPlaying = true; state.animFps = DEFAULTS.animFps;
      state.animPhase = 0; state.manualFrame = 0; state.renderMode = DEFAULTS.renderMode; state.dotSize = DEFAULTS.dotSize;
      state.angle = (DEFAULTS.angleDeg * Math.PI) / 180; state.autoSpin = true; state.springOn = true; state.fxOn = true;
      state.pitchDeg = DEFAULTS.pitchDeg; state.spacing = DEFAULTS.spacing; state.zoom = DEFAULTS.zoom;
      state.faceFocus = false; state.outlineOn = true; state.themeIdx = DEFAULTS.themeIdx;
      impulseSquash(1.10, 0.90); if (callbacks.onTimelineUpdate) callbacks.onTimelineUpdate(0, 24); notifyState();
    }

    canvas.addEventListener("pointerdown", (e) => {
      state.dragActive = true; state.dragId = e.pointerId; state.dragLastX = e.clientX; state.dragLastY = e.clientY;
      state.autoSpin = false; canvas.classList.add("dragging"); canvas.setPointerCapture(e.pointerId); notifyState();
    });
    canvas.addEventListener("pointermove", (e) => {
      if (!state.dragActive || e.pointerId !== state.dragId) return;
      const dx = e.clientX - state.dragLastX, dy = e.clientY - state.dragLastY;
      state.dragLastX = e.clientX; state.dragLastY = e.clientY;
      state.angle = (state.angle - dx * 0.011 + TWO_PI) % TWO_PI;
      if (Math.abs(dy) > 0.2) { state.pitchDeg = Math.max(-85, Math.min(90, state.pitchDeg + dy * 0.35)); notifyState(); }
    });
    const endDrag = (e) => { if (state.dragActive && e.pointerId === state.dragId) { state.dragActive = false; state.dragId = null; canvas.classList.remove("dragging"); } };
    canvas.addEventListener("pointerup", endDrag); canvas.addEventListener("pointercancel", endDrag);
    canvas.addEventListener("wheel", (e) => { e.preventDefault(); state.zoom = Math.max(0.8, Math.min(3.2, Math.round((state.zoom + (e.deltaY < 0 ? 0.1 : -0.1)) * 20) / 20)); notifyState(); }, { passive: false });

    window.addEventListener("keydown", (e) => {
      if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
      if (e.code === "KeyQ" || e.code === "ArrowLeft") keys.left = true;
      if (e.code === "KeyE" || e.code === "ArrowRight") keys.right = true;
      if (e.key === "[") stepMotion(-1); if (e.key === "]") stepMotion(1);
      if (e.key >= "1" && e.key <= "9") { const idx = Number(e.key) - 1; if (idx < MOTION_LIST.length) selectMotion(MOTION_LIST[idx].id); }
      if (e.code === "KeyF") toggleFaceFocus(); if (e.code === "KeyB") impulseSquash(0.84, 1.20);
      if (e.code === "Space") { e.preventDefault(); togglePlay(); } if (e.code === "KeyR") resetAll();
    });
    window.addEventListener("keyup", (e) => {
      if (e.code === "KeyQ" || e.code === "ArrowLeft") keys.left = false;
      if (e.code === "KeyE" || e.code === "ArrowRight") keys.right = false;
    });

    let lastTime = performance.now();
    function tick(now) {
      const dt = Math.max(0, Math.min(0.05, (now - lastTime) * 0.001)); lastTime = now;
      if (state.holdRotDir !== 0) state.angle = (state.angle + state.holdRotDir * 1.9 * dt) % TWO_PI;
      else if (keys.left) state.angle = (state.angle - 1.9 * dt) % TWO_PI;
      else if (keys.right) state.angle = (state.angle + 1.9 * dt) % TWO_PI;
      else if (state.autoSpin && !state.dragActive) state.angle = (state.angle + state.spinSpeed * dt) % TWO_PI;
      const mDef = curMotionDef(), fc = mDef ? (mDef.frames || 24) : 24;
      if (mDef && state.animPlaying) {
        state.animPhase = (state.animPhase + state.animFps * dt) % fc;
        const curF = Math.floor(state.animPhase) % fc;
        if (curF !== state.lastFrameIdx) {
          state.lastFrameIdx = curF;
          if (callbacks.onTimelineUpdate) callbacks.onTimelineUpdate(curF, fc);
          if (mDef.springBeats) { for (const b of mDef.springBeats) if (b.frame === curF) impulseSquash(b.sx, b.sy); }
        }
      }
      stepSpring(dt); renderFrame(now * 0.001); requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    return {
      getState: () => state, getConfig: () => CFG, getAssets: () => ASSET_MAP, getAssetSrc: (k) => ASSET_MAP[k] || null,
      getMotions: () => MOTION_LIST, getActiveMotion: () => curMotionDef(), getThemeName: () => THEMES[state.themeIdx].name,
      selectMotion, stepMotion, setFrame, togglePlay, toggleFaceFocus, resetAll,
      setRenderMode: (m) => { state.renderMode = m | 0; notifyState(); },
      setDotSize: (v) => { state.dotSize = v; if (state.renderMode > 1) state.renderMode = 0; notifyState(); },
      toggleDotPreset: () => { state.dotSize = state.dotSize <= 1.05 ? 1.35 : 1.0; if (state.renderMode > 1) state.renderMode = 0; notifyState(); },
      setFps: (v) => { state.animFps = Math.round(v); notifyState(); },
      setPitchDeg: (d) => { state.pitchDeg = Math.max(-85, Math.min(90, Math.round(d))); notifyState(); },
      setSpacing: (v) => { state.spacing = v; notifyState(); },
      setZoom: (v) => { state.zoom = v; notifyState(); },
      setAngleDeg: (d) => { state.angle = ((Number(d) || 0) * Math.PI) / 180; state.autoSpin = false; notifyState(); },
      setHoldRotDir: (d) => { state.holdRotDir = d; if (d !== 0) state.autoSpin = false; notifyState(); },
      toggleTopView: () => { state.faceFocus = false; state.pitchDeg = state.pitchDeg >= 89 ? DEFAULTS.pitchDeg : 90; notifyState(); },
      toggleSpread: () => { state.spacing = state.spacing >= 1.80 ? 1.0 : 2.0; notifyState(); },
      triggerBounce: () => impulseSquash(0.84, 1.20),
      toggleFlag: (k) => { state[k] = !state[k]; notifyState(); },
      cycleTheme: () => { state.themeIdx = (state.themeIdx + 1) % THEMES.length; notifyState(); },
      supportsAP3DLoad: () => false,
      getExportFormats: () => {
        const fmts = [{ id: "glb", label: ".GLB (3D)" }];
        if (witnessMesh || (opts.meshPayload && opts.meshPayload.witness)) fmts.push({ id: "glb_all", label: ".GLB+PET" });
        fmts.push({ id: "png", label: ".PNG" });
        return fmts;
      },
      buildGlbBytes: (includePet) => {
        if (!mainMesh) throw new Error("3D mesh not loaded yet");
        const parts = [{ name: "MainCharacter", rawV: mainMesh.rawV, rawI: mainMesh.rawI, offset: [0, 0, 11], scale: 1.0 }];
        if (includePet && witnessMesh) {
          parts.push({ name: "WitnessCompanion", rawV: witnessMesh.rawV, rawI: witnessMesh.rawI, offset: [56, -34, 24], scale: 0.92 });
        }
        return buildGlbBytes(parts);
      },
      async exportByFormat(fmt) {
        const slug = String(CFG.title || "character-3d").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "character-3d";
        if (fmt === "png") {
          const filename = slug + ".png";
          const blob = await new Promise((res) => canvas.toBlob(res, "image/png"));
          if (!blob) throw new Error("PNG capture failed");
          triggerDownload(blob, filename);
          return { filename, bytes: blob.size };
        }
        const includePet = (fmt === "glb_all");
        const bytes = this.buildGlbBytes(includePet);
        const filename = slug + (includePet ? "-with-pet.glb" : ".glb");
        triggerDownload(new Blob([bytes], { type: "model/gltf-binary" }), filename);
        return { filename, bytes: bytes.byteLength };
      },
    };
  }

  function autoBootstrap() {
    const root = document.getElementById("appRoot");
    if (!root || !global.AnimeUIKit) return;
    let engineRef = null;
    const proxy = new Proxy({}, { get: (_, prop) => (...args) => engineRef && typeof engineRef[prop] === "function" ? engineRef[prop](...args) : undefined });
    const ui = global.AnimeUIKit.mountStudioUI(root, proxy, { showFileIO: true });
    engineRef = createFull3DEngine({
      canvas: ui.canvas, config: global.SCENE_CONFIG || { motions: [] }, assets: global.SPRITE_ASSETS || {},
      meshPayload: global.FULL3D_MESH_DATA || null,
      onHudUpdate: (txt) => ui.updateHud(txt),
      onTimelineUpdate: (f, fc) => ui.updateTimeline(f, fc),
      onStateChange: () => { if (engineRef) ui.syncAll(); },
      onSceneChange: () => { if (engineRef) ui.syncScene(); },
    });
    ui.syncScene();
    global.ANIME_ENGINE = engineRef;
    global.ANIME_UI = ui;
  }

  global.Full3DEngine = { create: createFull3DEngine };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", autoBootstrap);
  else autoBootstrap();
})(window);

</script>
</body>
</html>
